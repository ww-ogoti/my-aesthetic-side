<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Aesthetic Space</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: #0b0b0b;
  color: white;
  font-family: 'Inter', sans-serif;
}

/* HEADER */
header {
  text-align: center;
  padding: 50px 20px 20px;
}

header h1 {
  font-size: 40px;
  letter-spacing: 3px;
}

header p {
  opacity: 0.7;
  margin-top: 10px;
}

/* GRID (Pinterest style) */
.grid {
  column-count: 3;
  column-gap: 12px;
  padding: 20px;
}

.grid img {
  width: 100%;
  margin-bottom: 12px;
  border-radius: 12px;
  transition: 0.3s;
  cursor: pointer;
}

.grid img:hover {
  transform: scale(1.02);
  opacity: 0.85;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 30px;
  font-size: 12px;
  opacity: 0.5;
}
</style>
</head>

<body>

<header>
  <h1>MY AESTHETIC SPACE</h1>
  <p>Outfits • Aesthetics • Moodboards ✨</p>
</header>

<div class="grid">
  <img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b">
  <img src="https://images.unsplash.com/photo-1520975958225-6bcd6e5f4b39">
  <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f">
  <img src="https://images.unsplash.com/photo-1520975869015-9b9d7a6c8d6c">
  <img src="https://images.unsplash.com/photo-1520975693410-001">
  <img src="https://images.unsplash.com/photo-1520975742345-002">
</div>

<footer>
  curated inspiration • some content remixed from creators
</footer>

</body>
</html>
