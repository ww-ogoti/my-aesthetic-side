<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aesthetic Feed</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: #0b0b0b;
  color: white;
  font-family: 'Inter', sans-serif;
}

/* HEADER */
header {
  text-align: center;
  padding: 60px 20px 20px;
}

header h1 {
  font-size: 42px;
  letter-spacing: 3px;
}

header p {
  opacity: 0.7;
}

/* MASONRY GRID */
.grid {
  column-count: 3;
  column-gap: 12px;
  padding: 20px;
}

/* images */
.grid img {
  width: 100%;
  margin-bottom: 12px;
  border-radius: 14px;
  transition: 0.3s;
  cursor: pointer;
}

.grid img:hover {
  transform: scale(1.02);
  opacity: 0.85;
}

/* loading text */
#loading {
  text-align: center;
  padding: 20px;
  opacity: 0.6;
}
</style>
</head>

<body>

<header>
  <h1>AESTHETIC FEED</h1>
  <p>Endless Pinterest-style inspiration ✨</p>
</header>

<div class="grid" id="grid"></div>

<div id="loading">loading more vibes...</div>

<script>
// 🔥 IMAGE POOL (you can add your Pinterest images here later)
const images = [
  "https://images.unsplash.com/photo-1520975869015-6c7f0c3f0a8d",
  "https://images.unsplash.com/photo-1520975693410-8c0f0f1b1c11",
  "https://images.unsplash.com/photo-1520975742345-9f1c2a3d4b88",
  "https://images.unsplash.com/photo-1520975958225-2f4c7d8a1b66",
  "https://images.unsplash.com/photo-1520976037612-1a2b3c4d5e77",
  "https://images.unsplash.com/photo-1520976101234-7f8a9b1c2d33"
];

const grid = document.getElementById("grid");
const loading = document.getElementById("loading");

let index = 0;

// function to add images
function loadImages(count = 6) {
  for (let i = 0; i < count; i++) {
    const img = document.createElement("img");
    img.src = images[index % images.length];
    grid.appendChild(img);
    index++;
  }
}

// initial load
loadImages();

// infinite scroll
window.addEventListener("scroll", () => {
  if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 200) {
    loadImages(6);
  }
});
</script>

</body>
</html>
