<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aesthetic Space</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  color: white;
  background: #0b0b0b;
}

/* NAV */
nav {
  position: fixed;
  top: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 25px;
  padding: 15px;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
  z-index: 100;
}

nav a {
  color: white;
  text-decoration: none;
  font-size: 13px;
  opacity: 0.7;
}

nav a:hover {
  opacity: 1;
}

/* SECTIONS */
section {
  min-height: 100vh;
  padding: 90px 20px 50px;
  transition: background 0.8s ease;
}

/* THEMES */
#home { background: #0b0b0b; }
#outfits { background: #111827; }
#pinterest { background: #0f172a; }
#inspo { background: #1f1f1f; }

/* GRID */
.grid {
  column-count: 3;
  column-gap: 12px;
}

.grid img {
  width: 100%;
  margin-bottom: 12px;
  border-radius: 12px;
  transition: 0.3s;
}

.grid img:hover {
  transform: scale(1.02);
  opacity: 0.85;
}

/* PINTEREST EMBED CONTAINER */
.pinterest-box {
  display: flex;
  justify-content: center;
  margin-top: 30px;
}

/* smooth fade */
section {
  animation: fade 0.8s ease;
}

@keyframes fade {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<nav>
  <a href="#home">Home</a>
  <a href="#outfits">Outfits</a>
  <a href="#pinterest">Pinterest</a>
  <a href="#inspo">Inspo</a>
</nav>

<!-- HOME -->
<section id="home">
  <h1>MY AESTHETIC SPACE</h1>
  <p>Scroll through curated visuals ✨</p>
</section>

<!-- OUTFITS -->
<section id="outfits">
  <h2>Outfits</h2>
  <div class="grid">
    <img src="https://images.unsplash.com/photo-1520975869015-6c7f0c3f0a8d">
    <img src="https://images.unsplash.com/photo-1520975693410-8c0f0f1b1c11">
  </div>
</section>

<!-- PINTEREST SECTION -->
<section id="pinterest">
  <h2>Pinterest Board</h2>

  <div class="pinterest-box">
    <!-- Replace THIS link with your Pinterest board -->
    <a data-pin-do="embedBoard"
       data-pin-board-width="500"
       data-pin-scale-height="300"
       data-pin-scale-width="80"
      href="https://www.pinterest.com/yourusername/outfits"
    </a>
  </div>

  <script async defer src="https://assets.pinterest.com/js/pinit.js"></script>
</section>

<!-- INSPO -->
<section id="inspo">
  <h2>Inspo</h2>
  <div class="grid">
    <img src="https://images.unsplash.com/photo-1520976037612-1a2b3c4d5e77">
    <img src="https://images.unsplash.com/photo-1520976101234-7f8a9b1c2d33">
  </div>
</section>

</body>
</html>
